# Source of truth for the tvOS app project. Regenerate with:
#   xcodegen generate --spec App/tvOS/project.yml
# The .xcodeproj and Info.plists are generated and not committed. App/Shared is the composition
# root shared with the iOS app; Top Shelf reads a snapshot the app writes to the App Group.
name: SpectoTV
options:
  bundleIdPrefix: dev.placeholder
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Core:
    path: ../../Packages/Core
  Library:
    path: ../../Packages/Library
  Playback:
    path: ../../Packages/Playback
  DesignSystem:
    path: ../../Packages/DesignSystem
  Features:
    path: ../../Packages/Features
  MPVRuntime:
    path: ../../Packages/MPVRuntime
targets:
  SpectoTV:
    type: application
    platform: tvOS
    sources:
      - Sources
      - path: ../SnapshotShared
      - path: Resources
        buildPhase: resources
      - path: ../Shared
      - path: ../../docs/licenses.md
        buildPhase: resources
      - path: ../iOS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Core
      - package: DesignSystem
      - package: Library
      - package: Features
        product: FeedFeature
      - package: Features
        product: LibraryFeature
      - package: Features
        product: PlaylistFeature
      - package: Features
        product: SearchFeature
      - package: Features
        product: ChannelFeature
      - package: Features
        product: InstancesFeature
      - package: Playback
        product: Playback
      - package: Playback
        product: PlaybackUI
      - target: TopShelf
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Specto
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # iCloud container for sync; empty disables it. Set with the iCloud entitlement (ADR 0004).
        CloudKitContainer: $(CLOUDKIT_CONTAINER)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: "Connect to your video instances on the local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Top Shelf items open videos through this scheme (TopShelfSnapshot.urlScheme).
        CFBundleURLTypes:
          - CFBundleURLName: dev.placeholder.specto.tv
            CFBundleURLSchemes: [dev.placeholder.specto.tv]
    entitlements:
      path: SpectoTV.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.placeholder.specto]
        # Apple TV profiles (ADR 0011): each person gets their own data, iCloud and keychain.
        com.apple.developer.user-management: [runs-as-current-user]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.specto.tv
        # Generated by scripts/make-icons.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        # Brand violet from the icon (Assets.xcassets/AccentColor), lighter in dark mode.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    scheme:
      testTargets:
        - SpectoTVUITests
  TopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - TopShelf
      - path: ../SnapshotShared
    dependencies:
      - sdk: TVServices.framework
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Specto Top Shelf
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.placeholder.specto]
        # Top Shelf shows the current profile's videos, like the app.
        com.apple.developer.user-management: [runs-as-current-user]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.specto.tv.topshelf
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
  SpectoTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - UITests
    dependencies:
      - target: SpectoTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.specto.tv.uitests
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
