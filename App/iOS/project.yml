# Source of truth for the iOS app project. Regenerate with:
#   xcodegen generate --spec App/iOS/project.yml
# The .xcodeproj and Info.plist are generated and not committed.
name: Player
options:
  bundleIdPrefix: dev.placeholder
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Core:
    path: ../../Packages/Core
  Library:
    path: ../../Packages/Library
  Playback:
    path: ../../Packages/Playback
  DesignSystem:
    path: ../../Packages/DesignSystem
  Features:
    path: ../../Packages/Features
targets:
  Player:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: Features
        product: FeedFeature
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Player
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Unlocks 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.player
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
