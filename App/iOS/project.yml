# Source of truth for the iOS app project. Regenerate with:
#   xcodegen generate --spec App/iOS/project.yml
# The .xcodeproj and Info.plist are generated and not committed.
name: Player
options:
  bundleIdPrefix: dev.placeholder
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Core:
    path: ../../Packages/Core
  Library:
    path: ../../Packages/Library
  Playback:
    path: ../../Packages/Playback
  DesignSystem:
    path: ../../Packages/DesignSystem
  Features:
    path: ../../Packages/Features
  MPVRuntime:
    path: ../../Packages/MPVRuntime
targets:
  Player:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: Core
      - package: DesignSystem
      - package: Features
        product: FeedFeature
      - package: Playback
        product: Playback
      - package: Playback
        product: PlaybackUI
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Player
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Unlocks 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.player
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # App code is main-actor by default (CLAUDE.md); test targets are not, because
        # XCTestCase's initializers and setUp are nonisolated.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    scheme:
      testTargets:
        - PlayerPerfTests
        - PlayerUITests
  PlayerPerfTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PerfTests
    dependencies:
      - target: Player
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.player.perftests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  PlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Player
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.player.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
