# Source of truth for the iOS app project. Regenerate with:
#   xcodegen generate --spec App/iOS/project.yml
# The .xcodeproj and Info.plist are generated and not committed.
name: Specto
options:
  bundleIdPrefix: dev.placeholder
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Core:
    path: ../../Packages/Core
  Library:
    path: ../../Packages/Library
  Playback:
    path: ../../Packages/Playback
  DesignSystem:
    path: ../../Packages/DesignSystem
  Features:
    path: ../../Packages/Features
  MPVRuntime:
    path: ../../Packages/MPVRuntime
  Cast:
    path: ../../Packages/Cast
schemes:
  # Release performance runs: excludes SpectoTests, whose @testable import needs a testable build.
  SpectoPerf:
    build:
      targets:
        Specto: all
    test:
      config: Release
      targets:
        - SpectoPerfTests
        - SpectoUITests
targets:
  Specto:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../Shared
        group: Shared
      - path: Resources
        buildPhase: resources
      - path: ../../docs/licenses.md
        buildPhase: resources
    dependencies:
      - package: Core
      - package: DesignSystem
      - package: Features
        product: FeedFeature
      - package: Features
        product: LibraryFeature
      - package: Features
        product: InstancesFeature
      - package: Features
        product: WatchFeature
      - package: Features
        product: SearchFeature
      - package: Features
        product: ChannelFeature
      - package: Library
      - package: Cast
      - package: Playback
        product: Playback
      - package: Playback
        product: PlaybackUI
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Specto
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # iCloud container for sync; empty disables it. Set with the iCloud entitlement (ADR 0004).
        CloudKitContainer: $(CLOUDKIT_CONTAINER)
        # Unlocks 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        # Background audio and Picture-in-Picture.
        UIBackgroundModes: [audio]
        # Self-hosted instances on the home network.
        NSLocalNetworkUsageDescription: "Connect to your video instances and Chromecasts on the local network."
        NSBonjourServices: [_googlecast._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.specto
        # Generated by scripts/make-icons.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # App code is main-actor by default (CLAUDE.md); test targets are not, because
        # XCTestCase's initializers and setUp are nonisolated.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # CarPlay audio entitlement: simulator builds only until Apple grants it; then add it to
        # device builds too (CODE_SIGN_ENTITLEMENTS without the sdk condition).
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": CarPlay.entitlements
      configs:
        Debug:
          # Offline downloads: never in App Store or TestFlight builds (guideline 5.2.3).
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG OFFLINE_DOWNLOADS
    scheme:
      testTargets:
        - SpectoTests
        - SpectoPerfTests
        - SpectoUITests
  SpectoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UnitTests
      # The tvOS Top Shelf link format, tested here because CI has no tvOS simulator runtime.
      - ../tvOS/TopShelfShared
    dependencies:
      - target: Specto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.specto.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  SpectoPerfTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PerfTests
    dependencies:
      - target: Specto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.specto.perftests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  SpectoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Specto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.placeholder.specto.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
