name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Hosted simulators are noisy: performance numbers here are a trend, not the gate
    # (CLAUDE.md). The gate is measured on a ProMotion device.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run CI
        run: scripts/ci.sh
        env:
          CI_OUTPUT: ${{ runner.temp }}/ci

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ${{ runner.temp }}/ci/*.log
