name: Nightly

# The adapters and the app against real instances, to catch API drift (CLAUDE.md: live contract
# tests run nightly). Instance URLs and the test account come from repository secrets, never
# from the repository.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  contract:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      - name: Contract tests
        run: scripts/contract-tests.sh
        env:
          PIPED_URL: ${{ secrets.PIPED_URL }}
          INVIDIOUS_URL: ${{ secrets.INVIDIOUS_URL }}
          YTZERO_URL: ${{ secrets.YTZERO_URL }}
          INSTANCE_USERNAME: ${{ secrets.INSTANCE_USERNAME }}
          INSTANCE_PASSWORD: ${{ secrets.INSTANCE_PASSWORD }}
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-log
          path: build/contract.log

  live-ui:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: UI tests against a real instance
        run: scripts/live-ui-tests.sh
        env:
          PIPED_URL: ${{ secrets.PIPED_URL }}
          CI_OUTPUT: ${{ runner.temp }}/live
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-ui
          path: |
            ${{ runner.temp }}/live/live-ui.log
            ${{ runner.temp }}/live/live-ui.xcresult
